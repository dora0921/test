<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>抽籤轉盤 1-22</title>
  <style>
    :root {
      --bg: #121212;
      --card: #1f1f1f;
      --text: #f8f8f8;
      --accent: #4caf50;
      --accent-soft: rgba(76, 175, 80, 0.15);
      --shadow: 0 18px 40px rgba(0, 0, 0, 0.3);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Noto Sans TC", sans-serif;
      background: radial-gradient(circle at top, #303030 0%, #101010 65%);
      color: var(--text);
    }

    .container {
      width: min(100%, 980px);
      padding: 24px;
      display: grid;
      gap: 24px;
      grid-template-columns: 1fr 340px;
      align-items: start;
    }

    .wheel-card,
    .panel {
      background: var(--card);
      border-radius: 28px;
      box-shadow: var(--shadow);
      padding: 24px;
    }

    .wheel-card {
      display: grid;
      place-items: center;
      min-height: 560px;
    }

    .wheel {
      position: relative;
      width: min(100%, 540px);
      aspect-ratio: 1 / 1;
      border-radius: 50%;
      overflow: hidden;
      border: 10px solid rgba(255, 255, 255, 0.08);
      box-shadow: inset 0 0 30px rgba(255, 255, 255, 0.05);
      background: radial-gradient(circle at center, #2b2b2b 0%, #111 75%);
    }

    .wheel::before {
      content: "";
      position: absolute;
      inset: 0;
      background: conic-gradient(
        from 0deg,
        #1e88e5 0deg 16.36deg,
        #43a047 16.36deg 32.72deg,
        #fdd835 32.72deg 49.08deg,
        #e53935 49.08deg 65.45deg,
        #8e24aa 65.45deg 81.81deg,
        #039be5 81.81deg 98.17deg,
        #43a047 98.17deg 114.54deg,
        #fdd835 114.54deg 130.9deg,
        #e53935 130.9deg 147.26deg,
        #8e24aa 147.26deg 163.63deg,
        #039be5 163.63deg 180deg,
        #1e88e5 180deg 196.36deg,
        #43a047 196.36deg 212.72deg,
        #fdd835 212.72deg 229.08deg,
        #e53935 229.08deg 245.45deg,
        #8e24aa 245.45deg 261.81deg,
        #039be5 261.81deg 278.17deg,
        #1e88e5 278.17deg 294.54deg,
        #43a047 294.54deg 310.9deg,
        #fdd835 310.9deg 327.26deg,
        #e53935 327.26deg 343.63deg,
        #8e24aa 343.63deg 360deg
      );
    }

    .wheel .segment {
      position: absolute;
      inset: 0;
      transform-origin: center;
      display: grid;
      place-items: center;
      font-size: 18px;
      color: #fff;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
    }

    .pointer {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translate(-50%, -100%);
      width: 0;
      height: 0;
      border-left: 16px solid transparent;
      border-right: 16px solid transparent;
      border-bottom: 40px solid #f44336;
      filter: drop-shadow(0 4px 16px rgba(244, 67, 54, 0.35));
      z-index: 12;
    }

    .center {
      position: absolute;
      inset: 50%;
      width: 120px;
      height: 120px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.12), rgba(0, 0, 0, 0.7));
      border: 4px solid rgba(255, 255, 255, 0.1);
      display: grid;
      place-items: center;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: #fff;
      z-index: 10;
    }

    .panel h1 {
      margin: 0;
      font-size: clamp(2rem, 3vw, 2.6rem);
      line-height: 1.1;
    }

    .panel p {
      margin: 1rem 0 0;
      color: #c5c5c5;
      line-height: 1.65;
    }

    .panel .result {
      margin-top: 24px;
      padding: 20px;
      border-radius: 20px;
      background: rgba(76, 175, 80, 0.08);
      border: 1px solid rgba(76, 175, 80, 0.18);
      font-size: 2.1rem;
      text-align: center;
      color: #e8f5e9;
      letter-spacing: 0.12em;
    }

    .panel button {
      width: 100%;
      margin-top: 24px;
      padding: 18px 20px;
      border: none;
      border-radius: 16px;
      background: linear-gradient(135deg, #4caf50, #66bb6a);
      color: #111;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 16px 30px rgba(76, 175, 80, 0.24);
    }

    .panel button:hover {
      transform: translateY(-2px);
      box-shadow: 0 20px 40px rgba(76, 175, 80, 0.3);
    }

    .panel button:active {
      transform: translateY(0);
    }

    @media (max-width: 900px) {
      .container {
        grid-template-columns: 1fr;
      }

      .wheel-card,
      .panel {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="wheel-card">
      <div class="wheel" id="wheel">
        <div class="pointer"></div>
        <div class="center">抽籤</div>
      </div>
    </div>

    <div class="panel">
      <h1>1-22 號抽籤轉盤</h1>
      <p>點擊按鈕抽出一個號碼。結果會以動畫形式顯示在轉盤上，並顯示最終中獎號碼。</p>
      <div class="result" id="result">-</div>
      <button id="spinButton">開始抽籤</button>
    </div>
  </div>

  <script>
    const wheel = document.getElementById('wheel');
    const spinButton = document.getElementById('spinButton');
    const resultBox = document.getElementById('result');
    const numbers = Array.from({ length: 22 }, (_, i) => i + 1);

    function createSegments() {
      const count = numbers.length;
      const angleStep = 360 / count;
      numbers.forEach((num, index) => {
        const segment = document.createElement('div');
        segment.className = 'segment';
        segment.textContent = num;
        const angle = index * angleStep + angleStep / 2;
        segment.style.transform = `rotate(${angle}deg) translateY(-220px) rotate(${-angle}deg)`;
        wheel.appendChild(segment);
      });
    }

    function pickRandomNumber() {
      const randomIndex = Math.floor(Math.random() * numbers.length);
      return numbers[randomIndex];
    }

    function spinWheel() {
      spinButton.disabled = true;
      spinButton.textContent = '抽籤中...';
      resultBox.textContent = '-';

      const selected = pickRandomNumber();
      const segmentAngle = 360 / numbers.length;
      const targetAngle = -(selected - 1) * segmentAngle - segmentAngle / 2;
      const rotations = 8;
      const finalRotation = rotations * 360 + targetAngle;

      wheel.style.transition = 'transform 5s cubic-bezier(0.33, 1, 0.68, 1)';
      wheel.style.transform = `rotate(${finalRotation}deg)`;

      setTimeout(() => {
        resultBox.textContent = `號碼 ${selected}`;
        spinButton.disabled = false;
        spinButton.textContent = '重新抽籤';
      }, 5200);
    }

    createSegments();
    spinButton.addEventListener('click', spinWheel);
  </script>
</body>
</html>
